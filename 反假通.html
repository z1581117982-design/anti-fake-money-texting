<style>/* ============ 反假通 · 单文件刷题应用 ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --navy:#0B3B6F; --navy-2:#08243F; --navy-3:#123E6B;
  --red:#C8102E; --red-soft:#B3261E; --gold:#C9A227; --gold-2:#E4C45C;
  --cream:#F6F4EF;
  --bg:#EEF2F7; --card:#FFFFFF; --ink:#141C28; --ink-2:#2B3647;
  --muted:#66707F; --muted-2:#8A94A3; --line:#E2E8F0; --line-2:#EDF1F6;
  --ok:#177A4C; --ok-bg:#E8F6EE; --bad:#B3261E; --bad-bg:#FDECEA;
  --shadow:0 1px 2px rgba(8,36,63,.06),0 10px 30px rgba(8,36,63,.06);
  --shadow-sm:0 1px 2px rgba(8,36,63,.08);
  --r:18px; --r-sm:14px;
  --sab:env(safe-area-inset-bottom,0px);
  --sat:env(safe-area-inset-top,0px);
}
html[data-theme="dark"]{
  --navy:#7FB3E8; --navy-2:#0B1220; --navy-3:#1B4B7D;
  --cream:#101A29;
  --bg:#0B1220; --card:#131C2B; --ink:#E9EDF3; --ink-2:#D3DAE4;
  --muted:#9AA6B6; --muted-2:#7C8899; --line:#263244; --line-2:#1C2635;
  --ok:#57C08B; --ok-bg:#11291F; --bad:#FF8A7F; --bad-bg:#2A1514;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html[data-font="l"]{font-size:17.5px}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  min-height:100dvh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 420px at 50% -12%,rgba(11,59,111,.10),transparent 70%),
    radial-gradient(600px 300px at 100% 100%,rgba(201,162,39,.07),transparent 70%);
}
html[data-theme="dark"] body::before{opacity:.55}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--navy);text-decoration:none}
h1,h2,h3,h4,p{margin:0}
img{display:block;max-width:100%}
.muted{color:var(--muted)}
.hidden{display:none!important}
.screen{max-width:640px;margin:0 auto;padding:calc(12px + var(--sat)) 16px 28px}
body.has-tab .screen{padding-bottom:calc(84px + var(--sab))}

/* ---------- 通用 ---------- */
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:14px;color:var(--ink-2);transition:background .15s}
.icon-btn:active{background:var(--line-2)}
.icon-btn svg{width:22px;height:22px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:0 20px;border-radius:15px;font-weight:650;font-size:1rem;
  background:var(--line-2);color:var(--ink);transition:transform .12s,filter .15s,opacity .15s;
  user-select:none;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,var(--navy-3),var(--navy));color:#fff;box-shadow:0 8px 20px rgba(11,59,111,.28)}
html[data-theme="dark"] .btn.primary{color:#06101C}
.btn.primary:disabled{opacity:.45;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink-2);border:1.5px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.gold{background:linear-gradient(135deg,#D9B44A,var(--gold));color:#2B2102;box-shadow:0 8px 20px rgba(201,162,39,.28)}
.btn.big{min-height:56px;font-size:1.05rem;border-radius:16px}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem;border-radius:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line-2)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;font-size:.75rem;font-weight:650;letter-spacing:.02em}
.t-single{background:rgba(11,59,111,.10);color:var(--navy)}
.t-multiple{background:rgba(201,162,39,.16);color:#8A6A05}
.t-judge{background:rgba(23,122,76,.12);color:var(--ok)}
.t-case{background:rgba(200,16,46,.10);color:var(--red)}
html[data-theme="dark"] .t-single{background:rgba(127,179,232,.16);color:#9CC7F2}
html[data-theme="dark"] .t-multiple{background:rgba(201,162,39,.18);color:var(--gold-2)}
html[data-theme="dark"] .t-judge{background:rgba(87,192,139,.14);color:#7AD3A6}
html[data-theme="dark"] .t-case{background:rgba(255,138,127,.14);color:#FFA79E}

/* ---------- 首页 ---------- */
.home-head{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;overflow:hidden;box-shadow:0 6px 16px rgba(11,59,111,.28);flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.brand h1{font-size:1.22rem;letter-spacing:.02em;line-height:1.2}
.brand p{font-size:.74rem;color:var(--muted);letter-spacing:.14em;margin-top:3px}
.hero{
  position:relative;border-radius:22px;padding:18px 18px 16px;overflow:hidden;color:#fff;
  background:linear-gradient(148deg,#0D4279 0%,#0B3B6F 45%,#0A2E57 100%);
  box-shadow:0 14px 34px rgba(11,59,111,.26);
}
.hero::after{content:"";position:absolute;right:-56px;bottom:-84px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,162,39,.42),rgba(201,162,39,0) 68%)}
.hero::before{content:"";position:absolute;left:-30px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%)}
.hero-top{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-num b{font-size:1.18rem;line-height:1;letter-spacing:-.01em}
.ring .ring-num span{font-size:.62rem;opacity:.72;margin-top:3px;letter-spacing:.08em}
.hero-info{min-width:0}
.hero-info .eyebrow{font-size:.7rem;letter-spacing:.16em;opacity:.72;margin-bottom:5px}
.hero-info h2{font-size:1.12rem;line-height:1.35;font-weight:700}
.hero-info .sub{font-size:.8rem;opacity:.78;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.hero-info .sub b{color:var(--gold-2);font-weight:700}
.hero-foot{position:relative;z-index:1;margin-top:14px;display:flex;gap:8px;align-items:center;font-size:.76rem;opacity:.8}
.hero-foot .dot{width:4px;height:4px;border-radius:50%;background:var(--gold-2);opacity:.8}

.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.section-title h3{font-size:.98rem;letter-spacing:.01em}
.section-title span{font-size:.76rem;color:var(--muted)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mode{
  position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:15px 14px 13px;
  box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .15s;
}
.mode:active{transform:scale(.985)}
.mode .m-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(11,59,111,.08);color:var(--navy);margin-bottom:4px}
.mode .m-ico svg{width:20px;height:20px}
.mode b{font-size:.96rem;font-weight:680;letter-spacing:.01em}
.mode small{font-size:.72rem;color:var(--muted);line-height:1.4}
.mode.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;padding:15px}
.mode.wide .m-ico{margin:0;flex:none}
.mode.wide .m-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mode.wide .go{color:var(--muted-2);flex:none}
.mode.exam{border-color:rgba(201,162,39,.45);background:linear-gradient(180deg,rgba(201,162,39,.07),transparent 70%),var(--card)}
.mode .cnt{position:absolute;top:12px;right:12px;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--bad-bg);color:var(--bad);font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.qs{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow-sm)}
.qs b{display:block;font-size:1.06rem;letter-spacing:-.01em}
.qs span{font-size:.7rem;color:var(--muted)}
.resume{
  margin-top:14px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;
  background:linear-gradient(135deg,rgba(201,162,39,.12),rgba(201,162,39,.03));border:1px solid rgba(201,162,39,.35);
}
.resume .r-ico{width:38px;height:38px;border-radius:12px;background:var(--gold);color:#2B2102;display:flex;align-items:center;justify-content:center;flex:none}
.resume .r-txt{flex:1;min-width:0}
.resume b{font-size:.92rem;display:block}
.resume small{font-size:.74rem;color:var(--muted)}
.resume .r-go{color:var(--gold);font-weight:700;font-size:.85rem}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:8px 10px calc(8px + var(--sab));
  background:color-mix(in srgb,var(--card) 86%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line-2);
}
.tab-inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:12px;color:var(--muted-2);font-size:.68rem;letter-spacing:.02em}
.tab svg{width:21px;height:21px}
.tab.active{color:var(--navy);font-weight:700}
.tab.active svg{filter:drop-shadow(0 2px 6px rgba(11,59,111,.3))}
html[data-theme="dark"] .tab.active{color:#9CC7F2}

/* ---------- 答题页 ---------- */
.q-screen{max-width:640px;margin:0 auto;padding-bottom:calc(112px + var(--sab));min-height:100dvh}
.q-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(6px + var(--sat)) 8px 6px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.q-top-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.q-counter{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.84rem;font-variant-numeric:tabular-nums;font-weight:650}
.timer svg{width:14px;height:14px;opacity:.7}
.timer.warn{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.q-bar{height:3px;background:var(--line-2);border-radius:2px;margin:2px 16px 0;overflow:hidden}
.q-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--navy),var(--gold));transition:width .25s}
.q-wrap{padding:14px 16px 0}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.q-meta .spacer{flex:1}
.flag-tag{font-size:.68rem;padding:2px 8px;border-radius:7px;background:rgba(201,162,39,.16);color:#8A6A05;font-weight:650}
.q-stem{font-size:1.06rem;line-height:1.78;letter-spacing:.01em;color:var(--ink);font-weight:520}
.q-stem .blank{color:var(--navy);font-weight:700}
.opts{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.opt{
  position:relative;display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  min-height:56px;padding:14px 14px 14px 13px;border-radius:15px;background:var(--card);
  border:1.5px solid var(--line);box-shadow:var(--shadow-sm);
  transition:border-color .15s,background .15s,transform .1s;color:var(--ink);
}
.opt:active{transform:scale(.994)}
.opt .key{width:28px;height:28px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--line-2);color:var(--muted);font-weight:750;font-size:.86rem;margin-top:1px;transition:.15s}
.opt .txt{flex:1;font-size:.96rem;line-height:1.55;padding-top:2px;word-break:break-word}
.opt .mark{width:22px;height:22px;flex:none;display:none;align-items:center;justify-content:center;margin-top:3px}
.opt.sel{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 7%,var(--card))}
.opt.sel .key{background:var(--navy);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.correct .mark{display:flex;color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt.wrong .mark{display:flex;color:var(--bad)}
.opt.missed{border-style:dashed;border-color:var(--gold);background:rgba(201,162,39,.07)}
.opt.missed .key{background:var(--gold);color:#2B2102}
.opt.missed::after{content:"漏选";position:absolute;right:12px;top:-8px;font-size:.62rem;font-weight:700;background:var(--gold);color:#2B2102;padding:1px 6px;border-radius:6px}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.judge .opt{min-height:64px}
.judge .opt .txt{font-size:1.02rem;font-weight:650}

.feedback{margin-top:16px;border-radius:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);animation:fadeUp .22s ease}
.feedback.ok{background:var(--ok-bg);border-color:transparent}
.feedback.bad{background:var(--bad-bg);border-color:transparent}
.fb-head{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700}
.fb-head .ico{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.feedback.ok .ico{background:var(--ok)}
.feedback.bad .ico{background:var(--bad)}
.fb-ans{margin-left:auto;font-size:.82rem;font-weight:600;opacity:.9}
.fb-note{margin-top:6px;font-size:.74rem;color:var(--muted);line-height:1.5}
.fb-flag{margin-top:6px;font-size:.72rem;color:#8A6A05;line-height:1.5}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.q-foot{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + var(--sab));
  background:linear-gradient(to top,var(--bg) 62%,color-mix(in srgb,var(--bg) 0%,transparent));}
.q-foot .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.q-foot .btn{flex:1}
.q-foot .side{flex:none;width:52px;height:52px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.q-foot .side svg{width:22px;height:22px}
.foot-hint{flex:1;text-align:center;font-size:.8rem;color:var(--muted);padding:16px 0}

/* ---------- 浮层 / 抽屉 ---------- */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(8,20,36,.46);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + var(--sab));transform:translateY(24px);transition:transform .24s cubic-bezier(.2,.8,.2,1);max-height:86dvh;overflow:auto;box-shadow:0 -12px 40px rgba(8,20,36,.25)}
.overlay.show .sheet{transform:none}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 14px}
.sheet h3{font-size:1.06rem;margin-bottom:2px}
.sheet .sheet-sub{font-size:.78rem;color:var(--muted);margin-bottom:16px}
.seg{display:flex;background:var(--line-2);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:.86rem;color:var(--muted);font-weight:600;transition:.15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip-btn{height:38px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:.86rem;color:var(--muted);font-weight:600;transition:.15s}
.chip-btn.on{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 8%,var(--card));color:var(--navy)}
.sheet-label{font-size:.76rem;color:var(--muted);margin:14px 0 8px;letter-spacing:.04em}
.sheet-actions{margin-top:18px;display:flex;gap:10px}
.sheet-actions .btn{flex:1}
.exam-rules{display:flex;flex-direction:column;gap:9px;margin:4px 0 6px}
.rule{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--ink-2);line-height:1.5}
.rule b{color:var(--navy);font-variant-numeric:tabular-nums}
.rule .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:8px;flex:none}

.grid-answers{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:4px}
.ans-cell{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:.8rem;font-weight:650;color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative}
.ans-cell.answered{background:color-mix(in srgb,var(--navy) 9%,var(--card));border-color:color-mix(in srgb,var(--navy) 35%,var(--line));color:var(--navy)}
.ans-cell.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.ans-cell.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.ans-cell.cur{outline:2px solid var(--gold);outline-offset:1px}
.ans-cell .fav-dot{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--gold)}

/* ---------- 列表 / 空态 ---------- */
.topbar{display:flex;align-items:center;gap:6px;padding:6px 0 10px;position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.topbar h2{font-size:1.06rem;font-weight:700;flex:1;text-align:center;margin-right:44px}
.topbar .right{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-row .chip-btn{flex:none;height:34px;font-size:.8rem;padding:0 13px}
.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line-2);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow-sm);text-align:left;width:100%;transition:transform .12s}
.row:active{transform:scale(.992)}
.row .r-no{width:34px;height:34px;flex:none;border-radius:10px;background:var(--line-2);color:var(--muted);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.row .r-main{flex:1;min-width:0}
.row .r-title{font-size:.88rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.row .r-sub{font-size:.7rem;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}
.row .chev{color:var(--muted-2);flex:none}
.empty{padding:44px 20px 30px;text-align:center}
.empty img{width:150px;margin:0 auto 14px;opacity:.95;mix-blend-mode:multiply}
html[data-theme="dark"] .empty img{mix-blend-mode:normal;opacity:.9;border-radius:16px}
.empty h3{font-size:1rem;margin-bottom:6px}
.empty p{font-size:.82rem;color:var(--muted);line-height:1.6;max-width:260px;margin:0 auto 18px}
.list-foot{position:sticky;bottom:calc(12px + var(--sab));padding-top:14px;background:linear-gradient(to top,var(--bg) 60%,transparent)}

/* ---------- 结算 ---------- */
.result-screen{padding-top:calc(8px + var(--sat))}
.result-hero{text-align:center;padding:8px 0 0}
.res-img{width:min(300px,74vw);margin:0 auto 2px;border-radius:20px}
.score-wrap{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-top:-2px}
.score{font-size:3.3rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.score small{font-size:1rem;font-weight:600;color:var(--muted);letter-spacing:0}
.verdict{display:inline-flex;align-items:center;gap:6px;margin:8px 0 2px;padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:700}
.verdict.pass{background:var(--ok-bg);color:var(--ok)}
.verdict.fail{background:var(--bad-bg);color:var(--bad)}
.result-sub{font-size:.8rem;color:var(--muted);margin-top:7px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:1.16rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:.68rem;color:var(--muted)}
.bars{margin-top:18px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:16px}
.bars h4{font-size:.9rem;margin-bottom:12px}
.bar-row{margin-bottom:12px}
.bar-row:last-child{margin-bottom:0}
.bar-top{display:flex;justify-content:space-between;font-size:.76rem;margin-bottom:5px;color:var(--muted)}
.bar-top b{color:var(--ink);font-weight:650}
.bar{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--navy),#3E7BB5)}
.bar i.gold{background:linear-gradient(90deg,#B8912A,var(--gold-2))}
.bar i.green{background:linear-gradient(90deg,#136B42,#57C08B)}
.bar i.red{background:linear-gradient(90deg,#A50D26,#E8556B)}
.wrong-block{margin-top:18px}
.wrong-block h4{font-size:.9rem;margin:0 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.wrong-block h4 span{font-size:.72rem;color:var(--muted);font-weight:500}
.wrong-item{background:var(--card);border:1px solid var(--line-2);border-radius:13px;padding:12px 13px;margin-bottom:8px}
.wrong-item .w-stem{font-size:.82rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrong-item .w-meta{display:flex;gap:8px;align-items:center;margin-top:7px;font-size:.7rem;color:var(--muted)}
.wrong-item .w-meta .ans{color:var(--ok);font-weight:700}
.wrong-item .w-meta .pick{color:var(--bad);font-weight:600}

/* ---------- 统计 ---------- */
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm)}
.sc .sc-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:.74rem}
.sc b{font-size:1.5rem;letter-spacing:-.02em;display:block;margin-top:6px;font-variant-numeric:tabular-nums}
.sc small{font-size:.72rem;color:var(--muted)}
.week-card{margin-top:12px;background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:16px}
.week{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:10px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wk .col{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--navy),#3E7BB5);min-height:3px;transition:height .4s}
.wk.today .col{background:linear-gradient(180deg,#B8912A,var(--gold-2))}
.wk span{font-size:.62rem;color:var(--muted)}
.exam-hist{margin-top:12px;background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:6px 16px}
.hist-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:.8rem}
.hist-row:last-child{border-bottom:0}
.hist-row .score-mini{font-weight:750;font-variant-numeric:tabular-nums;min-width:36px}
.hist-row .tag{font-size:.64rem;padding:2px 7px;border-radius:6px;font-weight:700}
.hist-row .tag.pass{background:var(--ok-bg);color:var(--ok)}
.hist-row .tag.fail{background:var(--bad-bg);color:var(--bad)}
.hist-row time{margin-left:auto;color:var(--muted);font-size:.72rem}

/* ---------- 设置 ---------- */
.group{background:var(--card);border:1px solid var(--line-2);border-radius:16px;overflow:hidden;margin-bottom:12px}
.group-title{font-size:.74rem;color:var(--muted);letter-spacing:.08em;margin:18px 4px 8px}
.cell{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.cell:last-child{border-bottom:0}
.cell .c-main{flex:1;min-width:0}
.cell .c-title{font-size:.9rem}
.cell .c-desc{font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.4}
.cell .c-side{color:var(--muted);font-size:.8rem;display:flex;align-items:center;gap:4px;flex:none}
.seg.mini{margin:0;width:168px;flex:none}
.seg.mini button{min-height:30px;font-size:.74rem;border-radius:8px}
.about{padding:16px;font-size:.76rem;color:var(--muted);line-height:1.7}
.about b{color:var(--ink)}

/* ---------- 弹窗 / toast ---------- */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(8,20,36,.5);opacity:0;pointer-events:none;transition:opacity .18s}
.modal.show{opacity:1;pointer-events:auto}
.modal-card{width:100%;max-width:340px;background:var(--card);border-radius:20px;padding:22px 20px 16px;box-shadow:0 24px 60px rgba(0,0,0,.3);transform:scale(.96);transition:transform .18s}
.modal.show .modal-card{transform:none}
.modal-card h3{font-size:1.02rem;margin-bottom:7px}
.modal-card p{font-size:.82rem;color:var(--muted);line-height:1.6}
.modal-actions{display:flex;gap:9px;margin-top:18px}
.modal-actions .btn{flex:1;min-height:46px;font-size:.9rem;border-radius:13px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translate(-50%,10px);z-index:90;background:rgba(14,25,40,.94);color:#fff;font-size:.82rem;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.22s;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 结果页按钮 ---------- */
.result-actions{display:flex;gap:10px;margin-top:18px}
.result-actions .btn{flex:1}
.tips{margin-top:14px;padding:12px 14px;border-radius:13px;background:rgba(11,59,111,.06);font-size:.74rem;color:var(--muted);line-height:1.55}
html[data-theme="dark"] .tips{background:rgba(127,179,232,.08)}

@media (min-width:700px){
  .screen{padding-top:calc(20px + var(--sat))}
  .q-screen{padding-bottom:120px}
  .tabbar{border-radius:20px 20px 0 0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

.overlay.centered{align-items:center;justify-content:center;padding:24px}
.overlay.centered .modal-card{width:100%;max-width:340px}

html{scrollbar-width:none}
::-webkit-scrollbar{width:0;height:0}

.cell .c-main{display:block}
.cell .c-title,.cell .c-desc{display:block}
body.has-tab .list-foot{bottom:calc(78px + var(--sab))}

.sheet .chips-row{gap:7px}
.sheet .chip-btn{padding:0 11px;font-size:.82rem;height:36px}
.sheet-actions{position:sticky;bottom:0;background:var(--card);padding-top:10px;margin-top:14px}
</style>
</head>

ge","q":"金融机构应对收缴的假币实物进行单独管理，并建立假币收缴代保管登记制度。（）","o":["正确","错误"],"a":"A"},{"i":"j210","t":"judge","q":"金融机构应当与现金机具厂商签订协议，确定现金机具冠字号码记录丢失情况下各方的职责义务。（）","o":["正确","错误"],"a":"A"},{"i":"j211","t":"judge","q":"金融机构应当制定本单位冠字号码管理以及利用冠字号码查询解决涉假纠纷工作的内控制度与操作规范，并加强对分支机构相关工作的管理考核。（）","o":["正确","错误"],"a":"A"},{"i":"j212","t":"judge","q":"金融机构应指定冠字号码数据归集行，负责核查所辖网点前一工作日上传的冠字号码信息的完整性。（）","o":["正确","错误"],"a":"A"},{"i":"j213","t":"judge","q":"金融机构应结合当地货币流通特点和反假货币形势，组织开展反假货币宣传。（）","o":["正确","错误"],"a":"A"},{"i":"j214","t":"judge","q":"金融机构收缴假币时，发现有制造贩卖假币线索或利用新的造假手段制造假币的，应当立即报告当地人民银行和公安机关。（）","o":["正确","错误"],"a":"A"},{"i":"j215","t":"judge","q":"金融机构收缴假币时，如一次性收缴假币数量达到5张（枚）以上，应当立即报告当地人民银行和公安机关。（）","o":["正确","错误"],"a":"A"},{"i":"j216","t":"judge","q":"金融机构收缴假币时，被收缴人不配合收缴的，应立即报告当地人民银行和公安机关。（）","o":["正确","错误"],"a":"A"},{"i":"j217","t":"judge","q":"金融机构收缴的假币由网点行向管理行、金融机构向当地人民银行解缴，均应做到按月全额解缴。","o":["正确","错误"],"a":"A"},{"i":"j218","t":"judge","q":"金融机构日常反假货币宣传工作应以城市繁华商贸区为重点宣传区域。（）","o":["正确","错误"],"a":"B"},{"i":"j219","t":"judge","q":"金融机构更新自助现金机具后，应及时接入冠字号码查询信息系统。（）","o":["正确","错误"],"a":"A"},{"i":"j220","t":"judge","q":"金融机构未按人民银行要求对现金机具、人员培训、冠字号码以及假币收缴鉴定业务等进行数据管理和报送的，人民银行将依照《中国人民银行货币鉴别及假币收缴、鉴定管理办法》第34条予以处罚。（）","o":["正确","错误"],"a":"A"},{"i":"j221","t":"judge","q":"金融机构清分中心发现的假币实物由清分中心指定专人保管。（）","o":["正确","错误"],"a":"A"},{"i":"j222","t":"judge","q":"金融机构清分中心发现的假币，只有100元面额的假币需要填写《假币代保管登记簿》。（）","o":["正确","错误"],"a":"B"},{"i":"j223","t":"judge","q":"金融机构清分中心对于网点缴存现金中发现假币可以退回网点去收缴。","o":["正确","错误"],"a":"B"},{"i":"j224","t":"judge","q":"金融机构清分中心对发现的假币应实行账实共管，假币实物与《假币代保管登记簿》的保管人员必须一致。（）","o":["正确","错误"],"a":"B"},{"i":"j225","t":"judge","q":"金融机构现金机具记录的冠字号码信息应于营业日次日传输到冠字号码查询信息系统。（）","o":["正确","错误"],"a":"B"},{"i":"j226","t":"judge","q":"金融机构现金清分中心存留的不盖章假币，应严格按照账实分开、定期核对的原则进行管理，确保假币账实相符。（）","o":["正确","错误"],"a":"A"},{"i":"j227","t":"judge","q":"金融机构现金管理部门应将清分中心发现的假币随同《假币解缴单》的电子和纸质文档，一并解缴到当地人民银行分支机构。（）","o":["正确","错误"],"a":"A"},{"i":"j228","t":"judge","q":"金融机构由本行清分并对外支付的现钞，由本行记录冠字号码。（）","o":["正确","错误"],"a":"A"},{"i":"j229","t":"judge","q":"金融机构的清分人员不办理柜面业务，可以不参加反假货币培训与评估直接上岗。","o":["正确","错误"],"a":"B"},{"i":"j230","t":"judge","q":"金融机构网点从本行现金清分中心领取的纸币钱捆，在现金清分中心已记录冠字号码的，可不再重复记录。（）","o":["正确","错误"],"a":"A"},{"i":"j231","t":"judge","q":"金融机构要对使用的现金机具的测试升级情况要有书面记录，以备查阅。（）","o":["正确","错误"],"a":"A"},{"i":"j232","t":"judge","q":"金融机构解缴假人民币应按伪造币与变造币、关注类与普通类分开包装解缴。（）","o":["正确","错误"],"a":"A"},{"i":"j233","t":"judge","q":"银行业金融机构反假货币工作联络会议工作制度是国务院反假货币工作联席会议机制的重要补充。（）","o":["正确","错误"],"a":"A"},{"i":"j234","t":"judge","q":"银行业金融机构反假货币联络会议定期召开会议，通报假币发现情况，商讨工作难点，提出改进意见。（）","o":["正确","错误"],"a":"B"},{"i":"j235","t":"judge","q":"雕刻凹印图文有很强的立体感，能表现纸币主景图案的层次、深浅和神韵，具有优秀的防伪性能。（）","o":["正确","错误"],"a":"A"},{"i":"j236","t":"judge","q":"雕刻凹印特征仅应用于第五套人民币正面图案。（）","o":["正确","错误"],"a":"B"},{"i":"j237","t":"judge","q":"雕刻凹印通过点、线设计展现著名人物的相貌、神情，为公众提供直观、便捷、有效的识别特点，强化了对纸币特征的记忆，具有极强的防伪性。（）","o":["正确","错误"],"a":"A"},{"i":"j238","t":"judge","q":"在紫外光下，港元2010年版的对印特征在正面和背面都呈现红黄两色荧光。（）","o":["正确","错误"],"a":"B"},{"i":"j239","t":"judge","q":"港元2010年版三家发钞行纸币在正面右侧采用了相同的洋紫荆花及面额数字水印。","o":["正确","错误"],"a":"A"},{"i":"j240","t":"judge","q":"港元2010年版中国银行券的珠光油墨位于正面主景中银大厦右部。（）","o":["正确","错误"],"a":"A"},{"i":"j241","t":"judge","q":"港元2010年版和2018年版的竖号码都有荧光特征。（）","o":["正确","错误"],"a":"B"},{"i":"j242","t":"judge","q":"港元2010年版汇丰银行券的珠光油墨位于正面主景铜狮的右下部，图案是行徽。（）","o":["正确","错误"],"a":"A"},{"i":"j243","t":"judge","q":"港元2010年版渣打银行券的珠光油墨位于正面主景神兽的右下部，图案是祥云。（）","o":["正确","错误"],"a":"A"},{"i":"j244","t":"judge","q":"港元2018年版各面额的凹印隐形面额数字均位于背面主景。","o":["正确","错误"],"a":"B"},{"i":"j245","t":"judge","q":"港元2018年版的光彩光变油墨图案与动感光变镂空安全线的变色和动感效果一致。（）","o":["正确","错误"],"a":"A"},{"i":"j246","t":"judge","q":"现行流通的港元纸币由汇丰银行、中国银行和渣打银行发行，其中渣打银行纸币发行量占总量的70％以上。（）","o":["正确","错误"],"a":"B"},{"i":"j247","t":"judge","q":"彩钞版100美元和50美元在背面也设置了缩微文字。（）","o":["正确","错误"],"a":"B"},{"i":"j248","t":"judge","q":"彩钞版100美元左下角面额数字和墨水瓶里自由钟的变色效果相同。（）","o":["正确","错误"],"a":"B"},{"i":"j249","t":"judge","q":"彩钞版和大头版的5美元水印图案相同。（）","o":["正确","错误"],"a":"B"},{"i":"j250","t":"judge","q":"彩钞版美元各面额彩色底纹的颜色、图纹相同。（）","o":["正确","错误"],"a":"B"},{"i":"j251","t":"judge","q":"美元各面额安全线上的缩微图文相同。（）","o":["正确","错误"],"a":"B"},{"i":"j252","t":"judge","q":"美元大头版和彩钞版光变油墨特征变色效果不同。（）","o":["正确","错误"],"a":"A"},{"i":"j253","t":"judge","q":"美元大头版和彩钞版相同面额的安全线在紫外光下呈现相同荧光颜色。（）","o":["正确","错误"],"a":"A"},{"i":"j254","t":"judge","q":"美元大头版的正面主景人像和背面建筑图案的背景中应用了彩色底纹，具有防范数码设备扫描复制的作用。（）","o":["正确","错误"],"a":"B"},{"i":"j255","t":"judge","q":"美元纸币正背面上，红蓝纤维呈现随机分布状态。（）","o":["正确","错误"],"a":"A"},{"i":"j256","t":"judge","q":"美元纸币正背面都应用了雕刻凹印技术。（）","o":["正确","错误"],"a":"A"},{"i":"j257","t":"judge","q":"美元纸币的磁性油墨分布在背面。（）","o":["正确","错误"],"a":"B"},{"i":"j258","t":"judge","q":"两版欧元的全埋安全线上文字完全相同。（）","o":["正确","错误"],"a":"B"},{"i":"j259","t":"judge","q":"第一版20欧元、10欧元和5欧元背面应用了珠光油墨。（）","o":["正确","错误"],"a":"A"},{"i":"j260","t":"judge","q":"第一版和第二版100欧元长度相同，宽度不同。（）","o":["正确","错误"],"a":"A"},{"i":"j261","t":"judge","q":"第一版和第二版欧元各面额背面图文应用了红外油墨特征。（）","o":["正确","错误"],"a":"B"},{"i":"j262","t":"judge","q":"第一版和第二版欧元背面桥梁部分应用了极为细小的缩微文字，需要放大观察。（）","o":["正确","错误"],"a":"A"},{"i":"j263","t":"judge","q":"第二版欧元不再发行500欧元，因此流通中的500欧元失去法定货币地位。（）","o":["正确","错误"],"a":"B"},{"i":"j264","t":"judge","q":"第二版欧元所有面额都应用了光彩光变数字。（）","o":["正确","错误"],"a":"A"},{"i":"j265","t":"judge","q":"第二版欧元有6种面额。（）","o":["正确","错误"],"a":"A"},{"i":"j266","t":"judge","q":"E版5000日元和10000日元正面左下角应用了全息标，转动观察可见面额数字与行徽交替变换，底纹中的樱花和缩微文字有彩虹色。（）","o":["正确","错误"],"a":"A"},{"i":"j267","t":"judge","q":"在紫外光下可以观察到在日元纸币正背面分布的无色荧光纤维。（）","o":["正确","错误"],"a":"B"},{"i":"j268","t":"judge","q":"日元纸币没有安全线。（）","o":["正确","错误"],"a":"A"},{"i":"j269","t":"judge","q":"第三版澳元塑料钞应用了3个透明视窗。（）","o":["正确","错误"],"a":"A"},{"i":"j270","t":"judge","q":"英镑塑料钞是塑料基材，没有水印、安全线和无色荧光纤维。（）","o":["正确","错误"],"a":"A"},{"i":"j271","t":"judge","q":"英镑塑料钞的全息3D王冠在视觉上有立体感，触摸有凸起感。（）","o":["正确","错误"],"a":"A"},{"i":"j272","t":"judge","q":"英镑塑料钞采用单面凹印技术制作，背面没有凹印特征。（）","o":["正确","错误"],"a":"A"},{"i":"c1","t":"case","q":"一客户于5月8日在某银行自助柜员机上取款1000元，一周后在超市使用现金时发现有一张假币。该客户联系取款行，要求解决问题。该银行正确的操作是（）。","o":["告知客户可以通过查询冠字号码确认假币是否由银行付出","告知客户应当提供超市发现假币的录像","告知客户携带有效证件、有异议纸币、办理取款业务的证明资料来银行办理查询","告知客户填写提交《人民币冠字号码查询申请表》"],"a":"ACD"},{"i":"c2","t":"case","q":"客户小张6月15日在商场消费时发现随身携带的现金中有一张假币，他到取款行反映，这张假币是6月4日在该行取款500元中的一张，取款行告知小王可以申请查询冠字号码。小张提供了取款证明材料及假币实物，取款行受理了小张的申请，并当即在假币上盖章。查询结果证明该假币不是取款行付出，向小张开具了《假币收缴凭证》。该银行的上述操作违反了冠字号码查询方面的哪些规定？（）。","o":["超过申请时效受理查询申请","未要求查询人提供有效身份证件","未执行假币实物暂不盖章，装袋封存，查询后再收缴的规定","未向小王出具《冠字号码查询结果通知书》"],"a":"BCD"},{"i":"c3","t":"case","q":"客户顾先生在某银行存取款一体机上支取了10张100元，对其中2张真伪有怀疑，于是拿着取款凭条向网点提出查询要求。该行员工通过核对流水信息等方式确认顾先生要求查询的现金是从该行存取款一体机里取出的。同时，该行员工对这两张100元当面进行了鉴别，结果都是人民币1999年版真币。顾先生得知都是真币的结果后放心离去。该银行的上述操作违反了冠字号码查询方面的哪些规定？（）。","o":["未要求查询人提供有效证件","未告知查询人应填写《冠字号码查询申请表》","未按规定先鉴别货币实物真伪，如为真币，终止查询流程；如为假币先暂行封装，查询结束后再收缴","未按规定向查询人出具《冠字号码查询结果通知书》"],"a":"ABCD"},{"i":"c4","t":"case","q":"张先生到某银行存款，柜员小李发现其中有1张50元疑似为假币，他马上叫来现金主管，两人经过仔细辨别后，确认这张50元纸币属于新类型假币，于是当着张先生的面盖上假币印章，开具了《假币没收收据》交给张先生，并告知了相关权利。张先生提出想看下假币实物以了解真假区别。考虑到张先生是银行老客户，小李和主管商量后在保安人员在场时将假币交给张先生察看。关于上述案例，正确的操作是（）。","o":["银行应当立即向当地人民银行和公安机关报告这张假币情况","柜员小李应开具《假币收缴凭证》","在银行保安人员在场时可以将假币交给客户察看","已确认为假币的不能让客户接触"],"a":"ABD"},{"i":"c5","t":"case","q":"某银行小李在办理客户王女士的存款业务时，发现其中一张人民币100元纸币可疑。经小李与网点主管和另一名柜员共同对该货币进行鉴别后认定为假币，于是当客户面加盖“假币”印章，并开具《假币收缴凭证》。但王女士拒绝提供个人证件信息，拒绝在《假币收缴凭证》签字，而且强烈要求退回该假币，由自己查验核对，尽管小李再三解释相关法律法规，并告知异议处理方式，王女士仍执意要查看假币，否则就要投诉小李并在网上曝光此事。针对上述情况，该银行正确的处理方式是（）。","o":["王小姐拒绝提供证件号码和签字，可以不必开具《假币收缴凭证》","为避免舆情影响银行形象，可以在保安人员在场时将假币交给客户查验","开具《假币收缴凭证》，在相关项目下注明“被收缴人拒绝签字”“拒绝提供身份信息”","向客户说明解释反假货币制度规定，包括收缴人不配合可以报警的等规定"],"a":"C"},{"i":"c6","t":"case","q":"某银行接到客户李先生电话投诉，称前段时间在该行取款时收到了假币，且假币已被另一银行收缴，要求办理冠字号码查询。根据李先生提供的办理取款的日期、金额与假币的冠字号码后，该行工作人员登录冠字号码查询系统，确认该假币非本行付出。该银行的上述做法，哪些违反了冠字号码查询管理的规定？（）","o":["未告知查询人应现场或委托他人代理填写书面《冠字号码查询申请表》","未要求查询人提供有效证件","未要求查询人提供办理现金取款业务的证明资料","未要求查询人提供《假币收缴凭证》"],"a":"ABCD"},{"i":"c7","t":"case","q":"某银行柜员小张在为本行员工小刘办理存款业务时，发现其中一张人民币100元疑似假币。于是叫来另一名柜员共同鉴别该币，确认为假币。小张告诉小刘这张钱是一张假币，并当面加盖了“假币”印章。但是小刘心存疑虑，要求小张将这张钱递给自己仔细察看。针对上述情况，柜员小张正确的处理方式是（）。","o":["将假币一端拿在自己手里，另一端伸出窗口给小刘查看","将假币通过大堂经理交给小刘查看","因为客户是本行员工，互相熟悉，直接交给小刘查看","隔着柜台窗口，将该假币不符合真币防伪特征的地方指给小刘看，并告知如有真伪异议可申请鉴定"],"a":"D"},{"i":"c8","t":"case","q":"某银行现金清分中心操作员在清分回笼现金中发现可疑的人民币，当天临近下班，其他人都在忙着收尾工作，他再三验看确认是假币后，填写了《假币代保管登记簿》，在假币实物上加盖“假币”印章，交假币保管人员与柜面收缴的假币一起妥善保管。该操作员有哪些违规操作？（）。","o":["发现假币未向现场负责人报告","未换人复核假币","在清分中心发现的假币上加盖“假币”印章","把清分发现的假币与柜面收缴假币混合存放"],"a":"ABCD"},{"i":"c9","t":"case","q":"某银行现金清分中心操作员小李在清分网点缴存现金时，发现了3张100元面额的假人民币纸币。按照人民银行有关规定，其正确的处理方式是（）。","o":["操作员小李应立即向清分中心现场负责人报告发现假币的情况，并换人复核","现场负责人填写《假币代保管登记簿》","在假币上加盖“假币”印章，使用专用袋封存，单独存放","在3个工作日内向当地人民银行报告发现假币情况并解缴实物"],"a":"ABD"},{"i":"c10","t":"case","q":"某银行网点自助设备更新后，暂时未接入冠字号码查询系统，客户查询冠字号码可以通过本机记录查询。冠字号码记录数据每半月集中上传到上级行。某客户至网点投诉，称在该存取款一体机中取出假币，网点要求客户填写《人民币冠字号码查询申请表》，并告知5个工作日内办结。受理中发现客户资料不全，告知客户不能为其办理查询，拒绝受理。该银行的上述操作违反了冠字号码查询方面的哪些规定？（）","o":["自助设备更新后未及时接入冠字号码查询信息系统","网点的冠字号码记录未在每日营业终了集中上传到指定的数据归集行","未告知客户补齐相关材料","未按规定时间完成冠字号码查询处理"],"a":"ABCD"},{"i":"c11","t":"case","q":"甲银行委托乙银行代理现金清分业务，并记录存储清分现金的冠字号码信息。4月10日，乙银行将3月10日清分的现金调运给甲银行。5月10日，甲银行将该批现金支付给其公司客户。该批现金的冠字号码信息乙银行应至少保存至（）之后。","o":["6月10日","7月10日","8月10日"],"a":"C"},{"i":"c12","t":"case","q":"银行柜员小周在为一名客户办理存款时，先用点钞机点了一遍没有异常，又用手工清点了一遍，发现其中1张100元是假币。当时正值营业高峰，他当即持币离开柜面绕到另外一个同事的柜面，两人一起鉴别，确认这是一张假币，再次放入点钞机，该假币能够通过而不报警。随后两人当客户面对假币盖章，填制《假币收缴凭证》并交纷给顾客签字后，让客户离开，他们又开始办理下一笔业务，直至营业终了。上述操作中收缴人员存在哪些违规问题？（）","o":["未执行当面办理假币收缴的规定，持币离开客户视线","未及时停用不能识别假币的机具，而是继续用于办理业务","未及时联系机具厂商对不能识别假币的机具进行升级测试","未按规定向被收缴人告知相关权利"],"a":"ABCD"},{"i":"c13","t":"case","q":"客户许女士到某银行网点柜面存入20张100美元，柜员小王办理时发现其中有8张疑似假币。他叫来网点主管共同鉴别，并和另一名复核人员携带假币到专门摆放鉴定设备的房间去进一步复核，确定这8张100美元为假币。小王遂将假币情况告诉许女士，并当面在假币上加盖“假币”印章，然后装入专用袋加封，向许女士开具《假币收缴凭证》，完成收缴业务。上述操作中柜员小王的违规做法是（）。","o":["发现假币张数已达到报告起点，未按规定报告当地人民银行和公安机关","在假外币纸币上加盖“假币”印章","未向许客户告知相关权利","办理收缴中假币脱离客户视线"],"a":"ABCD"},{"i":"c14","t":"case","q":"柜员小张一个月前参加过反假货币培训和测评，测评未达标。一天他在为客户办理美元存款时发现一张100元美元是假币，当时正值午餐时间，客户催促下他一人在假币上加盖了“假币”印章，向客户出具《假币收缴凭证》后，客户匆匆离去。上述操作中，柜员小张违反了（）等反假货币制度规定。","o":["现金从业人员应经过培训和测评，确保具备判断和挑剔假币的能力","双人办理假币收缴业务","柜面发现假外币不盖章，应当装入专用袋，封口处盖“假币”章","收缴时应向被收缴人告知相关权利"],"a":"ABCD"},{"i":"c15","t":"case","q":"柜员小王在为客     download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>',
    upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 21h16"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 14h10l1-14"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 4.4 3 7.6 7 9 4-1.4 7-4.6 7-9V6Z"/><path d="m8.5 12 2.4 2.4 4.6-4.8"/></svg>'
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- 状态 ---------- */
  const blank = () => ({
    v: 1, progress: {}, favs: [], exams: [], daily: {},
    settings: { theme: 'system', font: 'm' },
    session: null, lastResult: null
  });
  let store = blank();
  let saveTimer = null;
  let storageWarned = false;
  let timerId = null;
  let toastTimer = null;
  const ui = { sheet: null };

  function loadStore() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      if (!s || s.v !== 1) return;
      store = Object.assign(blank(), s);
      store.settings = Object.assign({ theme: 'system', font: 'm' }, s.settings || {});
      if (!Array.isArray(store.favs)) store.favs = [];
      store.favs = store.favs.filter(id => BY_ID.has(id));
      if (!Array.isArray(store.exams)) store.exams = [];
      if (!store.daily || typeof store.daily !== 'object') store.daily = {};
    } catch (e) { /* ignore corrupt state */ }
  }
  function save(now) {
    if (DEMO) return;
    const write = () => {
      try { localStorage.setItem(KEY, JSON.stringify(store)); }
      catch (e) {
        if (!storageWarned) { storageWarned = true; toast('进度无法保存，请检查浏览器存储设置'); }
      }
    };
    clearTimeout(saveTimer);
    if (now) write(); else saveTimer = setTimeout(write, 260);
  }
  function storageOK() {
    try { const k = '__fj_test__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; }
  }

  /* ---------- 工具 ---------- */
  const pad = n => String(n).padStart(2, '0');
  const dayKey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  function fmtTime(ms) {
    if (ms == null || ms < 0) ms = 0;
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return h > 0 ? h + ':' + pad(m) + ':' + pad(ss) : m + ':' + pad(ss);
  }
  function fmtDate(ts) {
    const d = new Date(ts);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function shuffle(a) {
    const arr = a.slice();
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }
  const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
  const letters = q => q.o.map((_, i) => String.fromCharCode(65 + i));
  const ansLetters = q => String(q.a).split('').filter(k => letters(q).includes(k));
  function answerText(q) {
    if (q.t === 'judge') return String(q.a).charAt(0) === 'A' ? '正确' : '错误';
    return ansLetters(q).join('、');
  }
  function isCorrect(q, picked) {
    const a = ansLetters(q).slice().sort().join('');
    const p = Array.from(new Set(picked || [])).filter(k => letters(q).includes(k)).sort().join('');
    return !!p && a === p;
  }

  /* ---------- 进度 ---------- */
  function wrongIds() {
    return Object.keys(store.progress).filter(id => {
      const p = store.progress[id];
      return p && p.wrong > 0 && p.streak < 2;
    }).sort((a, b) => (store.progress[b].ts || 0) - (store.progress[a].ts || 0));
  }
  function recordAnswer(q, picked) {
    const p = store.progress[q.i] || (store.progress[q.i] = { seen: 0, right: 0, wrong: 0, streak: 0, ts: 0 });
    const ok = isCorrect(q, picked);
    p.seen++; p.ts = Date.now();
    if (ok) { p.right++; p.streak++; } else { p.wrong++; p.streak = 0; }
    const k = dayKey();
    store.daily[k] = (store.daily[k] || 0) + 1;
    return ok;
  }
  function computeStats() {
    const vals = Object.keys(store.progress).map(k => store.progress[k]);
    const covered = vals.filter(p => p.seen > 0).length;
    const seen = vals.reduce((a, p) => a + p.seen, 0);
    const right = vals.reduce((a, p) => a + p.right, 0);
    const mastered = vals.filter(p => p.streak >= 2).length;
    let streak = 0;
    const d = new Date();
    if (!(store.daily[dayKey(d)] > 0)) d.setDate(d.getDate() - 1);
    while (store.daily[dayKey(d)] > 0) { streak++; d.setDate(d.getDate() - 1); }
    return {
      covered, seen, right, mastered, streak,
      acc: pct(right, seen),
      today: store.daily[dayKey()] || 0,
      wrong: wrongIds().length,
      favs: store.favs.length,
      best: store.exams.reduce((m, e) => Math.max(m, e.score), 0)
    };
  }

  /* ---------- 路由 ---------- */
  function currentRoute() {
    const h = location.hash.replace(/^#\/?/, '').split('?')[0];
    return h || 'home';
  }
  function go(route) {
    const target = '#/' + route;
    if (location.hash === target) { render(); return; }
    location.hash = target;
  }
  window.addEventListener('hashchange', () => render());

  /* ---------- 通用渲染 ---------- */
  function tabbarHTML(active) {
    return '<div class="tab-inner">' +
      '<a class="tab ' + (active === 'home' ? 'active' : '') + '" href="#/home">' + I.home + '<span>首页</span></a>' +
      '<a class="tab ' + (active === 'wrong' ? 'active' : '') + '" href="#/wrong">' + I.book + '<span>错题本</span></a>' +
      '<a class="tab ' + (active === 'stats' ? 'active' : '') + '" href="#/stats">' + I.chart + '<span>统计</span></a>' +
      '</div>';
  }

  function render(opts) {
    opts = opts || {};
    const route = currentRoute();
    const keep = opts.keepScroll ? window.scrollY : 0;
    let html = '';
    if (route === 'quiz') html = screenQuiz();
    else if (route === 'result') html = screenResult();
    else if (route === 'wrong') html = screenWrong();
    else if (route === 'fav') html = screenFav();
    else if (route === 'stats') html = screenStats();
    else if (route === 'settings') html = screenSettings();
    else html = screenHome();
    $('#view').innerHTML = html;
    const hasTab = ['home', 'wrong', 'fav', 'stats'].includes(route);
    document.body.classList.toggle('has-tab', hasTab);
    $('#tabbar').innerHTML = hasTab ? tabbarHTML(route) : '';
    if (timerId) { clearInterval(timerId); timerId = null; }
    if (route === 'quiz') startTimerIfExam();
    if (keep) requestAnimationFrame(() => window.scrollTo(0, keep));
    else window.scrollTo(0, 0);
  }

  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function openOverlay(html, centered) {
    const ov = $('#overlay');
    ov.innerHTML = html;
    ov.className = 'overlay show' + (centered ? ' centered' : '');
  }
  function closeOverlay() {
    const ov = $('#overlay');
    ov.className = 'overlay';
    ov.innerHTML = '';
  }
  let confirmCb = null;
  function confirmDialog(title, desc, okText, cb, danger) {

      '<div class="modal-card"><h3>' + esc(title) + '</h3><p>' + esc(desc) + '</p>' +
      '<div class="modal-actions"><button class="btn ghost" data-act="confirm-cancel">取消</button>' +
      '<button class="btn ' + (danger ? 'danger' : 'primary') + '" data-act="confirm-ok">' + esc(okText) + '</button></div></div>', true);
  }

  /* ---------- 首页 ---------- */
  function screenHome() {

    const ses = store.session;

        '<button class="mode" data-act="open-wrong"><span class="cnt">' + s.wrong + '</span><span class="m-ico" style="background:rgba(200,16,46,.08);color:var(--red)">' + I.book + '</span><b>错题本</b><small>连对 2 次自动移出</small></button>' +
        '<button class="mode" data-act="open-fav"><span class="m-ico" style="background:rgba(201,162,39,.14);color:#8A6A05">' + I.star + '</span><b>收藏</b><small>' + s.favs + ' 道已收藏</small></button>' +
      '</div>';
    return '<div class="screen">' +
      '<header class="home-head"><div class="brand"><div class="logo"><img src="' + ICON + '" alt="反假通"></div>' +
        '<div><h1>反假通</h1><p>货币反假 · 刷题</p></div></div>' +
        '<button class="icon-btn" data-act="settings" aria-label="设置">' + I.gear + '</button></header>' +
      '<section class="hero"><div class="hero-top">' +
        '<div class="ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="7"/>' +
          '<circle cx="42" cy="42" r="36" fill="none" stroke="#E4C45C" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + dash + ' 226.2"/></svg>' +
          '<div class="ring-num"><b>' + cov + '%</b><span>已覆盖</span></div></div>' +
        '<div class="hero-info"><p class="eyebrow">题库覆盖</p><h2>' + s.covered + ' / ' + TOTAL + ' 题</h2>' +
          '<div class="sub"><span>正确率 <b>' + s.acc + '%</b></span><span>已掌握 <b>' + s.mastered + '</b></span></div></div></div>' +
        '<div class="hero-foot"><span>连续练习 <b>' + s.streak + '</b> 天</span><span class="dot"></span><span>今日 ' + s.today + ' 题</span></div>' +
      '</section>' + cta +
      '<div class="section-title"><h3>刷题方式</h3><span>4 种题型 · 全库 ' + TOTAL + ' 题</span></div>' + modes +
      '<div class="quick-stats">' +
        '<div class="qs"><b>' + (s.best || '—') + '</b><span>模考最高分</span></div>' +
        '<div class="qs"><b>' + s.mastered + '</b><span>已掌握</span></div>' +
        '<div class="qs"><b>' + s.wrong + '</b><span>待巩固错题</span></div>' +
      '</div></div>';
  }

  /* ---------- 练习设置 ---------- */
  function openPracticeSheet(mode) {
    const random = mode === 'random';
    ui.sheet = { type: 'practice', mode, filter: 'all', size: random ? 20 : 20, order: random ? 'random' : 'seq' };
    const chips = [['all', '全部'], ['single', '单选'], ['multiple', '多选'], ['judge', '判断'], ['case', '案例']].map(([k, label]) =>
      '<button class="chip-btn ' + (k === 'all' ? 'on' : '') + '" data-filter="' + k + '">' + label + '</button>').join('');
    const sizes = [['10', '10 题'], ['20', '20 题'], ['all', '全部']].map(([k, label]) =>
      '<button class="' + (ui.sheet.size === (k === 'all' ? 'all' : +k) ? 'on' : '') + '" data-seg="size" data-val="' + k + '">' + label + '</button>').join('');
    const orders = [['seq', '顺序'], ['random', '随机']].map(([k, label]) =>

    openOverlay('<div class="sheet"><div class="sheet-grab"></div><h3>' + (random ? '随机练习' : '顺序刷题') + '</h3>' +
      '<p class="sheet-sub">选好范围和题量，随时可以中断续练</p>' +

      '<p class="sheet-sub">按真实占比组卷，交卷后出成绩单</p>' +
      '<div class="exam-rules">' +
        '<div class="rule"><span class="dot"></span><span><b>100 题</b>：单选 40 · 多选 28 · 判断 30 · 案例 2</span></div>' +
        '<div class="rule"><span class="dot"></span><span><b>60 分钟</b>倒计时，1 题 1 分，<b>' + PASS + ' 分</b>及格</span></div>' +
        '<div class="rule"><span class="dot"></span><span>考试中不显示答案，未答按错计</span></div>' +
        '<div class="rule"><span class="dot"></span><span>中途退出可继续，倒计时不暂停</span></div>' +
      '</div>' +
